[project]
name = "alien-ink"
version = "0.1.10"
description = "Alien Ink"
authors = [
    { name = "Cody Collier", email = "cmcollier@gmail.com" }
]
readme = "README.md"
requires-python = ">= 3.11"
license = { file = "LICENSE" }
keywords = [
    'artificial intelligence',
    'machine learning',
]

classifiers = [
    'Development Status :: 4 - Beta',
    'Intended Audience :: Developers',
    'Topic :: Scientific/Engineering :: Artificial Intelligence',
    'License :: OSI Approved :: MIT License',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
]

dependencies = [
    'python-dotenv>=1.0',
    'torch>=2.0',
]

[project.urls]
Homepage = "https://pypi.org/project/alien-ink/"
Repository = "https://github.com/codycollier/alien-ink"

[project.optional-dependencies]
wb = [
    "wandb>=0.16",
]
hf = [
    "accelerate>=1.1.0",
    "datasets>=2.14",
    "transformers>=4.40",
    "wandb>=0.16",
]

examples = [
    "tqdm",
]

test = [
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.pytest.ini_options]
pythonpath = [
    "."
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.sdist]
include = [
    "alien_ink",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.hatch.build.targets.wheel]
packages = ["alien_ink"]

# PyPI torch defaults to CUDA 13.0 (needs driver >= 580). Pin the CUDA 12.6
# index for Linux/Windows so older drivers (e.g. CUDA 12.2) still get a GPU
# build. macOS falls back to PyPI (no CUDA wheels there).
# For `uv pip install`, also set UV_TORCH_BACKEND=cu126 (see bin/exp-setup.sh).
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]


