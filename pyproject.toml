[project]
name = "alien-ink"
version = "0.3.7"
description = "Alien Ink"
authors = [
    { name = "Cody Collier", email = "cmcollier@gmail.com" }
]
readme = "README.md"
requires-python = ">= 3.11"
license = { file = "LICENSE" }
keywords = [
    'artificial intelligence',
    'machine learning',
]

classifiers = [
    'Development Status :: 4 - Beta',
    'Intended Audience :: Developers',
    'Topic :: Scientific/Engineering :: Artificial Intelligence',
    'License :: OSI Approved :: MIT License',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
]

dependencies = [
    'python-dotenv>=1.0',
    # Transformers 5 requires PyTorch >=2.4. Keep the runtime floor aligned
    # with the current supported Trainer/model stack rather than allowing a
    # resolver to install an unusable combination.
    'torch>=2.4',
]

[project.urls]
Homepage = "https://pypi.org/project/alien-ink/"
Repository = "https://github.com/codycollier/alien-ink"

[project.optional-dependencies]
wb = [
    "wandb>=0.16",
]
hf = [
    "accelerate>=1.1.0",
    "datasets>=2.14",
    "transformers>=4.46",
    "wandb>=0.16",
]

# Optional RTX/CUDA acceleration for Gemma. Liger's fused linear cross-entropy
# avoids materializing the full 256k-vocabulary logits tensor during training.
liger = [
    "liger-kernel>=0.5",
]

examples = [
    "tqdm",
]

test = [
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.pytest.ini_options]
pythonpath = [
    "."
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.sdist]
include = [
    "alien_ink",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.hatch.build.targets.wheel]
packages = ["alien_ink"]
